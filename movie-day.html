<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фильм дня — NASTROENIE</title>
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body data-page="movie-day">
  <main class="page">
    <header class="header">
      <a class="brand brand--link" href="index.html">NASTROENIE</a>
    </header>

    <section class="hero hero--results movie-page">
      <article class="movie-detail" id="movie-detail" hidden>
        <img class="movie-detail-poster" id="movie-poster" alt="">
        <div class="movie-detail-info">
          <span class="movie-day-badge" id="movie-day-badge" hidden>Фильм дня</span>
          <h1 class="title movie-detail-title" id="movie-title"></h1>
          <div class="movie-meta" id="movie-meta"></div>
          <ul class="movie-moods" id="movie-moods"></ul>
          <ul class="movie-genres" id="movie-genres"></ul>
          <p class="movie-description" id="movie-description"></p>
          <a class="back-link" id="back-link" href="index.html">← На главную</a>
        </div>
      </article>

      <p class="empty-state" id="movie-empty" hidden></p>

      <a class="back-link back-link--ghost" id="home-link" href="index.html" hidden>← На главную</a>
    </section>

    <footer class="footer">
      
    </footer>
  </main>

  <script src="js/movie.js?v=10"></script>
</body>
</html>
