<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настроение — подбери фильм</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <main class="page">
    <header class="header">
      <span class="brand">NASTROENIE</span>
    </header>

    <section class="hero">
      <h1 class="title">Что ты хочешь почуствовать?</h1>

      <form class="searchbar" id="mood-form">
        <span class="lock" aria-hidden="true"></span>
        <input
          type="text"
          class="search-input"
          id="mood-input"
          placeholder="напр.: грустно, хочется приключений, одиноко вечером..."
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" class="go-btn" aria-label="Подобрать фильм">
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div class="mood-grid">
        <button type="button" class="mood-card mood-card--happy" data-mood="радость">
          <span class="mood-face" aria-hidden="true">
            <svg viewBox="0 0 100 100" focusable="false">
              <g fill="#fff">
                <circle cx="33" cy="40" r="4.2"/>
                <circle cx="67" cy="40" r="4.2"/>
              </g>
              <path
                d="M27 55 Q50 77 73 55"
                fill="none"
                stroke="#fff"
                stroke-width="6"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="mood-label">Радость</span>
        </button>

        <button type="button" class="mood-card mood-card--sad" data-mood="грусть">
          <span class="mood-face" aria-hidden="true">
            <svg viewBox="0 0 100 100" focusable="false">
              <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
                <path d="M24 38 L42 31"/>
                <path d="M76 38 L58 31"/>
                <path d="M30 80 Q50 66 70 80"/>
              </g>
              <g fill="#fff">
                <ellipse cx="33" cy="48" rx="4.2" ry="4.6"/>
                <ellipse cx="67" cy="48" rx="4.2" ry="4.6"/>
              </g>
              <path
                d="M40 55 C 42.5 59 44 61 44 62.5 A 4.5 4.5 0 0 1 35 62.5 C 35 61 36.5 59 40 55 Z"
                fill="#fff"
              />
            </svg>
          </span>
          <span class="mood-label">Грусть</span>
        </button>

        <button type="button" class="mood-card mood-card--angry" data-mood="злость">
          <span class="mood-face" aria-hidden="true">
            <svg viewBox="0 0 100 100" focusable="false">
              <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round">
                <path d="M22 31 L44 42"/>
                <path d="M78 31 L56 42"/>
                <path d="M30 79 Q50 63 70 79"/>
              </g>
              <g fill="#fff">
                <ellipse cx="34" cy="52" rx="4.6" ry="3.6"/>
                <ellipse cx="66" cy="52" rx="4.6" ry="3.6"/>
              </g>
            </svg>
          </span>
          <span class="mood-label">Злость</span>
        </button>

        <button type="button" class="mood-card mood-card--horror" data-mood="ужас">
          <span class="mood-face" aria-hidden="true">
            <svg viewBox="0 0 100 100" focusable="false">
              <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round">
                <path d="M22 33 Q33 25 44 33"/>
                <path d="M56 33 Q67 25 78 33"/>
                <circle cx="33" cy="52" r="7"/>
                <circle cx="67" cy="52" r="7"/>
                <ellipse cx="50" cy="78" rx="8" ry="10"/>
              </g>
              <g fill="#fff">
                <circle cx="33" cy="52" r="2.5"/>
                <circle cx="67" cy="52" r="2.5"/>
              </g>
            </svg>
          </span>
          <span class="mood-label">Ужас</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      
    </footer>
  </main>

  <script src="js/app.js?v=7"></script>
</body>
</html>
